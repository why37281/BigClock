# ============================================================
# BigClock 配置文件示例
#
# 程序首次启动时会在【exe 同目录】自动生成 bigclock.toml，
# 那个文件才是真正生效的。这份只是示例 / 备份参考。
#
# 改完存盘 1 秒内界面自动更新，不用重启。
# 也可以按 F1 在设置界面里改，改完会写回同一个文件（注释会丢，属正常）。
#
# 真正生效的 bigclock.toml 被设成了 Windows「隐藏」属性：资源管理器里
# 默认看不到，勾上「显示隐藏的项目」才看得见（只是看不见，不是打不开）。
# ============================================================

# ---------- 显示 ----------
# theme   : dark（晚自习）/ light（白天开灯）/ 彩色主题：
#           indigo 靛蓝 / ocean 深海 / forest 森林 / grape 葡萄
#           sunset 落日 / rose 玫瑰 / paper 宣纸（亮）/ mint 薄荷（亮）
# mode    : fullscreen（全屏）/ window（窗口）/ float（浮窗·置顶小窗）
#           —— 只记"上一次的形态"：启动时 window 会强制回全屏，float 会保留
# half    : full（整屏）/ left（左半屏）/ right（右半屏）/ custom（自定义边界）
#           —— 黑板挡哪边选哪边；custom 时配合 crop_left / crop_right 微调
# screen  : 第几块显示器，0 = 主屏（2 块屏时可选 0 / 1）
# contrast: A | A2 | B | C —— 只对暗色基础主题有效，越往后越柔
#           A 最清晰 19.5:1 / A2 推荐 15.7:1 / B 13.9:1 / C 最柔 12.3:1
# tint    : neutral（中性）/ cyan（偏青，与语义色同族）/ warm（偏暖）
#           —— 只对 dark / light 两个基础主题有效
# crop_left / crop_right : 自定义边界（half = custom 时生效），
#           左右各缩进屏宽的百分比（0 = 不缩），两侧合计 ≤ 70（显示区至少 30%）
# float_w / float_h : 浮窗大小（逻辑像素），0 = 用默认（640×260）
# float_x / float_y : 浮窗位置（物理像素），-1 = 不指定
# clock_format: hm（19:29）/ hms（19:29:53）
# title   : 顶部标题，留空则不显示
theme        = "dark"
mode         = "fullscreen"
half         = "full"
screen       = 0
contrast     = "A2"
tint         = "cyan"
crop_left    = 0.0
crop_right   = 0.0
float_w      = 0.0
float_h      = 0.0
float_x      = -1
float_y      = -1
clock_format = "hm"
title        = ""

# ---------- 进度条 ----------
# enabled    : 是否显示进度条
# show_names : 是否在当前段里显示段名
# gap_minutes: 两个时段之间的空档是否自动补成「课间」段
[bar]
enabled     = true
show_names  = false
gap_minutes = true

# ---------- 作息表 ----------
# 进度条按每段的真实时长分配宽度（长课长胶囊，课间短胶囊）。
# 时间写法很宽松：18:40 / 1840 / 全角 18：40 都认。
# 跨零点也支持，例如 start = "23:30", end = "00:10"。
# 段名不能为空，时段之间不能重叠（重叠会被程序拒绝保存并提示）。
[[periods]]
name  = "晚自习"
start = "18:40"
end   = "19:00"

# 再加时段就照抄上面三行：
# [[periods]]
# name  = "第一节"
# start = "19:00"
# end   = "19:40"
