[package]
name = "bigclock"
version = "0.1.0"
description = "教室晚自习大屏时钟"
authors = ["why37281"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "6"
dirs = "5"

# 发布版要小：去掉符号、开 LTO
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
