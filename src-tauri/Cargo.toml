[package]
name = "bigclock"
version = "0.1.0"
description = "教室晚自习大屏时钟"
authors = ["why37281"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 【刻意保持极简】只留前端做不到的事：配置文件的读写与 TOML 解析。
# 被删掉的依赖及原因：
#   windows-sys  → 窗口几何切割、显示器枚举都搬去前端了（CSS + 官方 JS API）
#   notify       → 热重载改成前端轮询文件文本，省掉防抖与跨线程切主线程
#   dirs         → 用一个环境变量读 %APPDATA% 就够了
[dependencies]
# devtools：release 版也能按 F12 打开控制台。
# 让用户在自己机器上直接抓前端报错，比在无头环境里靠推测快得多。
# 代价是体积略增，正式发布时可以去掉这个 feature。
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# 仅用于"启动失败时弹一个原生错误框"。
# WebView2 建不起来时进程会直接退出，那时没有任何窗口可用来显示错误，
# 只能靠系统 MessageBox。库很小，不会拖大体积。
tinyfiledialogs = "3"

# 发布版要小：去符号、开 LTO、单 codegen 单元
#
# 【刻意不开 panic = "abort"】
# 开了它之后，任何 panic 都会被编译成 __fastfail 立即终止进程 ——
# 表现就是"双击后转一下圈，进程没了，什么都不显示"（事件日志里是 0xc0000409）。
# 这种"静默死亡"极难排查，宁可多占一点体积也要让 panic 走正常路径，
# 至少能落到我们的 panic hook 里写进启动日志。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
