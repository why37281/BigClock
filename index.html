<!doctype html>
<html lang="zh-CN" data-theme="dark" data-half="full" data-pal="A2" data-sem="on" data-tint="cyan">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BigClock</title>
<!-- 自检：内联脚本一定会执行。它先记下"文档开始解析"，再把全局错误记下来。
     排查"前端整块没跑起来"时，靠它就能区分"module 没加载"和"代码里抛异常"。
     正常运行时这两行毫无副作用。 -->
<script>
  window.__selfcheck = ["boot"];
  addEventListener("error", function (e) {
    var t = e.target;
    if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
      window.__selfcheck.push("资源加载失败: " + (t.src || t.href));
    } else {
      window.__selfcheck.push("错误: " + (e.message || e.type));
    }
  }, true);
  addEventListener("unhandledrejection", function (e) {
    window.__selfcheck.push("未处理拒绝: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
</script>
<link rel="stylesheet" href="./src/styles.css" />
</head>
<body>

<!-- ================= 展示层 ================= -->
<div class="view" id="view">
  <header id="header">
    <div class="bar-wrap" id="bar-wrap">
      <div class="title" id="title"></div>
      <div class="segs" id="segs"></div>
    </div>
  </header>

  <main>
    <div class="clock" id="clock"></div>
    <div class="date" id="date"></div>
  </main>
</div>

<!-- 控制条：照搬 design-preview.html 的 #devbar（半透明黑底 + 圆角 + blur）。
     平时隐形，鼠标移到左下角才浮现，不挡大屏。
     刻意只留三项：主题 / 显示模式 / 设置入口。
     对比度、底色这类"调一次就不动"的放进了设置面板。 -->
<div id="devbar">
  <!-- 主题：亮 / 暗 -->
  <button id="btn-theme" title="亮 / 暗" aria-label="切换主题">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
  </button>

  <div class="sep"></div>

  <!-- 显示模式：一个图标四态循环（整屏 → 左半屏 → 右半屏 → 自定义边界），
       纹理跟着变。<g class="modefill"> 由 JS 直接改 innerHTML，
       控制条和浮窗按钮排里各有一个，paintModeIcon 一并画。 -->
  <button id="mode" title="整屏 → 左半屏 → 右半屏 → 自定义边界" aria-label="切换显示模式">
    <svg viewBox="0 0 24 24" fill="none">
      <rect x="2.5" y="4.5" width="19" height="15" rx="2.4" stroke="currentColor" stroke-width="1.8"/>
      <g class="modefill">
        <rect class="st" x="4.2" y="6.2" width="15.6" height="11.6" rx="1.4"/>
      </g>
    </svg>
  </button>
  <div class="sep"></div>

  <!-- 全屏 / 退出全屏：两个按钮同一时间只显示一个（由 JS 按当前状态切换），
       效果和 F11 完全一样。分开做成两个按钮，是为了不用记"这个键现在是进还是退"。 -->
  <button id="btn-enter-fs" title="全屏（F11）" aria-label="全屏">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/>
    </svg>
  </button>
  <button id="btn-exit-fs" title="退出全屏（F11）" aria-label="退出全屏" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/>
    </svg>
  </button>

  <!-- 浮窗：缩成始终置顶的小窗，课间放视频/课件时时间仍然可见 -->
  <button id="btn-float" title="浮窗（置顶小窗）" aria-label="切换到浮窗">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2.5"/>
      <rect x="12.5" y="11" width="7" height="6" rx="1.5" fill="currentColor" stroke="none"/>
    </svg>
  </button>
  <div class="sep"></div>

  <!-- 设置：作息表编辑器 + 显示/外观 -->
  <button id="btn-settings" title="设置（F1）" aria-label="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.83 1.17v.17a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.08A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.08A1.65 1.65 0 0 0 20.91 10H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
  <div class="sep"></div>

  <!-- 退出：全屏/浮窗没有标题栏，这里（和浮窗按钮排）是唯一的可见出口 -->
  <button id="btn-quit" title="退出程序" aria-label="退出程序">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v8"/>
      <path d="M6.4 6.8a8 8 0 1 0 11.2 0"/>
    </svg>
  </button>
</div>

<!-- ================= 浮窗层 =================
     mode = "float" 时窗口本身变成置顶小窗，页面里只显示这个圆角卡片。
     显隐完全由 html[data-mode] 控制（默认 display:none），不用 hidden 属性 ——
     作者规则的 display:flex 会盖掉 [hidden] 的 UA 规则，这个坑踩过两次了。
     点一下时钟 → 弹出按钮排（对应全屏控制条的四个按钮）；再点一下收起。
     整张卡片可拖动（触屏可用）；右下角手柄改大小（有最小尺寸）。 -->
<div id="float">
  <div class="fclock-wrap" id="fclock-wrap">
    <div class="fclock" id="fclock"></div>
  </div>
  <div class="float-actions" id="float-actions" hidden>
    <button class="fa" id="fa-theme" title="亮 / 暗" aria-label="切换主题">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>
    <!-- 不放"显示模式"按钮：浮窗里半屏状态不可见（只影响回全屏后的样子），
         点了没有任何可见反馈，反而让人困惑。要切半屏，回全屏后用控制条或方向键。 -->
    <button class="fa" id="fa-fs" title="回到全屏" aria-label="回到全屏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/>
      </svg>
    </button>
    <button class="fa" id="fa-settings" title="设置（F1）" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.83 1.17v.17a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.08A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.08A1.65 1.65 0 0 0 20.91 10H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button class="fa" id="fa-quit" title="退出程序" aria-label="退出程序">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v8"/>
        <path d="M6.4 6.8a8 8 0 1 0 11.2 0"/>
      </svg>
    </button>
  </div>
  <!-- 右下角缩放手柄：L 形斜纹 -->
  <div class="float-handle" id="float-handle" title="拖动调整大小" aria-label="调整浮窗大小">
    <svg viewBox="0 0 18 18">
      <path d="M16 8L8 16M16 12.5L12.5 16"/>
    </svg>
  </div>
</div>

<!-- ================= 自定义边界层 =================
     half = "custom" 时出现两条可拖竖线；3 秒无交互自动淡出（JS 加 .dim），
     任意点击再亮回来。边界本身一直生效。 -->
<div id="cropbar" hidden aria-hidden="true">
  <div class="crop-line crop-l" id="crop-l">
    <span class="crop-grip">
      <svg viewBox="0 0 24 24"><path d="M8 12H2.5M5 9l-3 3 3 3M16 12h5.5M19 9l3 3-3 3"/></svg>
    </span>
  </div>
  <div class="crop-line crop-r" id="crop-r">
    <span class="crop-grip">
      <svg viewBox="0 0 24 24"><path d="M8 12H2.5M5 9l-3 3 3 3M16 12h5.5M19 9l3 3-3 3"/></svg>
    </span>
  </div>
</div>

<!-- ================= 设置层 ================= -->
<div class="settings" id="settings" hidden>
  <div class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-h">
    <div class="settings-head">
      <h1 id="settings-h">设置</h1>
      <div class="settings-status" id="settings-status"></div>
      <button class="icon-btn" id="btn-close" title="关闭（Esc）" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>

    <div class="settings-body">
      <!-- ---------- 作息方案 ---------- -->
      <section class="sec">
        <div class="sec-head">
          <h2>作息方案</h2>
          <span class="hint">每套方案一份完整作息（如上午自习 / 晚自习各一套），进度条随方案切换</span>
        </div>
        <div class="plan-row">
          <select id="f-plan" aria-label="选择作息方案"></select>
          <input type="text" id="f-plan-name" maxlength="20" placeholder="当前方案名" aria-label="方案名" />
          <button class="btn" id="btn-plan-add">另存新方案</button>
          <button class="btn ghost" id="btn-plan-del">删除</button>
        </div>
      </section>

      <!-- ---------- 作息表（编辑当前方案） ---------- -->
      <section class="sec">
        <div class="sec-head">
          <h2>作息表</h2>
          <span class="hint">进度条按每段真实时长分配宽度，编辑的是当前选中的方案</span>
        </div>
        <div class="periods" id="periods"></div>
        <div class="sec-foot">
          <button class="btn" id="btn-add-period">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            添加时段
          </button>
          <span class="hint" id="periods-summary"></span>
        </div>
      </section>

      <!-- ---------- 显示 ---------- -->
      <section class="sec">
        <div class="sec-head"><h2>显示</h2></div>
        <div class="grid">
          <label class="field">
            <span>显示模式</span>
            <select id="f-mode">
              <option value="fullscreen">全屏展示</option>
              <option value="window">窗口配置</option>
              <option value="float">浮窗（置顶小窗）</option>
            </select>
          </label>

          <!-- 显示器下拉：界面上先藏起来（单屏教室用不上，减少干扰），
               但 fillScreens / readForm 的逻辑留着 —— 加 hidden 而不是删元素，
               dom.f.screen 等代码不需要动。配套的 .field[hidden] 显隐规则在 styles.css。 -->
          <label class="field" hidden>
            <span>显示器</span>
            <select id="f-screen"></select>
          </label>

          <label class="field">
            <span>时长格式</span>
            <select id="f-clockfmt">
              <option value="hm">时:分（19:29）</option>
              <option value="hms">时:分 + 秒数小尾巴（19:29 53）</option>
            </select>
          </label>

          <label class="field span2">
            <span>时间偏移（秒，可正可负；学校挂钟不准时校准用，如 +8）</span>
            <input type="number" id="f-timeoffset" step="1" placeholder="0" />
          </label>

          <label class="field span2">
            <span>顶部标题（留空则不显示）</span>
            <input type="text" id="f-title" maxlength="40" placeholder="例如：高三（2）班 晚自习" />
          </label>
        </div>
      </section>

      <!-- ---------- 外观 ---------- -->
      <section class="sec">
        <div class="sec-head"><h2>外观</h2></div>
        <div class="grid">
          <label class="field">
            <span>主题</span>
            <select id="f-theme">
              <option value="dark">暗色（晚自习）</option>
              <option value="light">亮色（白天/开灯）</option>
              <option value="indigo">靛蓝</option>
              <option value="ocean">深海</option>
              <option value="forest">森林</option>
              <option value="grape">葡萄</option>
              <option value="sunset">落日</option>
              <option value="rose">玫瑰</option>
              <option value="paper">宣纸（亮）</option>
              <option value="mint">薄荷（亮）</option>
            </select>
          </label>

          <label class="field">
            <span>对比度档位（仅暗色主题）</span>
            <select id="f-contrast">
              <option value="A">A · 最清晰（19.5:1）</option>
              <option value="A2">A2 · 推荐（15.7:1）</option>
              <option value="B">B · 更柔（13.9:1）</option>
              <option value="C">C · 最柔（12.3:1）</option>
            </select>
          </label>

          <label class="field">
            <span>背景色偏（仅基础双主题）</span>
            <select id="f-tint">
              <option value="cyan">偏青（与语义色同族）</option>
              <option value="neutral">中性</option>
              <option value="warm">偏暖</option>
            </select>
          </label>
        </div>
      </section>

      <!-- ---------- 进度条 ---------- -->
      <section class="sec">
        <div class="sec-head"><h2>进度条</h2></div>
        <div class="grid">
          <label class="field">
            <span>显示进度条</span>
            <select id="f-bar-enabled">
              <option value="true">显示</option>
              <option value="false">隐藏</option>
            </select>
          </label>

          <!-- 顶条已压扁（--bar-h 1.8vmin），段名显示没有意义，开关一并藏起来；
               show_names 的读写逻辑保留，手改配置文件仍生效。 -->
          <label class="field" hidden>
            <span>当前段显示段名</span>
            <select id="f-bar-names">
              <option value="false">不显示</option>
              <option value="true">显示</option>
            </select>
          </label>

          <label class="field">
            <span>空洞自动补成课间</span>
            <select id="f-bar-gap">
              <option value="true">自动补</option>
              <option value="false">不补</option>
            </select>
          </label>
        </div>
      </section>

      <!-- ---------- 配置文件 ---------- -->
      <section class="sec">
        <div class="sec-head"><h2>配置文件</h2></div>
        <p class="hint file-hint">
          作息表保存在下面这个文本文件里，可以直接用记事本编辑，存盘即时生效，不用重启。<br />
          这个文件被设成了「隐藏」（资源管理器里勾上「显示隐藏的文件」才看得到）；
          点「打开所在文件夹」会直接定位到它。
        </p>
        <div class="file-row">
          <code id="cfg-path">…</code>
          <button class="btn" id="btn-open-file">打开所在文件夹</button>
          <button class="btn" id="btn-reload">重新读取</button>
        </div>
      </section>
    </div>

    <div class="settings-foot">
      <span class="hint" id="dirty-hint"></span>
      <button class="btn ghost" id="btn-revert">放弃修改</button>
      <button class="btn primary" id="btn-save">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="corner-note" id="corner-note" hidden></div>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
